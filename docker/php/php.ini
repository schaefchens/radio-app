; Local defaults close to the host. Upload limits that matter in production
; live in server/public/.user.ini, which FPM reads here too.
date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 60
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
