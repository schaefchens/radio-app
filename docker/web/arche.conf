ServerName localhost
DocumentRoot "/var/www/site"

<Directory "/var/www/site">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Hand .php to the FPM container. Both containers mount the site at the same
# path, so the script filename resolves identically on both sides.
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

DirectoryIndex index.html index.php

# The site is a macOS bind mount; Apache's advice for network file systems.
EnableMMAP Off
EnableSendfile Off

# The host sends .js as text/javascript. Mirroring it keeps the deflate rules
# in the .htaccess files honest (see server/public/.htaccess).
AddType text/javascript .js .mjs

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 common

# The e2e stack's stand-in for BunnyCDN (docker/e2e/compose.e2e.yaml publishes
# it): the same /program and /media on a second port, so the app reads them
# cross-origin as it does from the edge. The site's .htaccess already allows
# any origin on success; the edge also does on a 404, which the app must be
# able to read (a second header on a 200 would make browsers refuse it).
# Unpublished, and so unused, in the dev stack.
Listen 8091
<VirtualHost *:8091>
    DocumentRoot "/var/www/site"
    <LocationMatch "^/(program|media)/">
        Header always set Access-Control-Allow-Origin "*" "expr=%{REQUEST_STATUS} -ge 400"
    </LocationMatch>
    <LocationMatch "^/(?!(program|media)/)">
        Require all denied
    </LocationMatch>
</VirtualHost>
